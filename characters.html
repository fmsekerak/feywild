<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feywild | Adventurer Inventory</title>
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/shared.css">
<link rel="stylesheet" href="assets/css/characters.css"></head>
<body><header class="banner"><canvas id="bannerParticles"></canvas><h1>Adventurer's Satchel</h1></header>
<nav><ul><li><a href="index.html">Home</a></li><li><a href="crafting.html">Crafting</a></li><li><a href="search.html">Search</a></li><li><a href="characters.html" class="active" aria-current="page">Characters</a></li></ul></nav>
<main><section class="card"><h2>Your Adventurers</h2><p id="status" role="status" aria-live="polite">Preparing the magic...</p>
<div id="auth"><button id="login" type="button">Continue with Google</button></div>
<div id="signed-in" hidden><p id="account"></p><button id="logout" type="button">Sign out</button>
<label for="character">Select character</label><select id="character"><option value="">Choose your character</option></select>
<div id="inventory" hidden><h3 id="character-name"></h3><form id="add-item">
<label for="item-search">Find an item</label><input id="item-search" type="search" placeholder="Search available items...">
<label for="catalog-item">Choose an item</label><select id="catalog-item" required><option value="">Select an item</option></select><p id="catalog-description" aria-live="polite"></p>
<label for="item-quantity">Quantity</label><input id="item-quantity" type="number" min="1" max="999999" value="1" required>
<button type="submit">Add item</button></form><ul id="items"></ul></div></div></section></main>
<script src="assets/js/particles.js"></script><script src="assets/js/shared.js"></script>
