<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feywild | D1 Preview</title>
<link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/shared.css">
<style>main{max-width:760px;margin:2rem auto;padding:1rem}.preview-panel{padding:1.5rem;margin:1rem 0}select{max-width:100%;padding:.6rem}li{margin:.5rem 0}small{opacity:.8}</style></head>
<body><header class="banner"><h1>✧ Cloudflare D1 Preview ✧</h1></header>
<main><section class="card preview-panel"><h2>Database connection</h2><p id="status" role="status">Reading Cloudflare D1…</p><p id="counts"></p></section>
<section class="card preview-panel"><h2>Character inventory preview</h2>
<label for="character">Adventurer</label> <select id="character"><option value="">Choose a character</option></select>
<ul id="items"></ul><p><small>This page is read-only. Your live inventory still uses Supabase.</small></p></section>
<p><a href="home.html">← Return to Feywild</a></p></main>
<script type="module">
const $=id=>document.getElementById(id);
try {
 const response=await fetch("/api/d1-preview",{cache:"no-store"});
 if(!response.ok) throw Error("D1 preview unavailable ("+response.status+")");
 const data=await response.json();
 $("status").textContent="Connected to Cloudflare D1 ✓";
 $("counts").textContent=data.characters.length+" characters · "+data.catalog.length+" catalog items · "+data.inventory.length+" inventory items";
 for(const character of data.characters) $("character").add(new Option(character.name,character.id));
 function render(){
   $("items").replaceChildren();
   const matches=data.inventory.filter(item=>item.character_id===$("character").value);
   for(const item of matches){
     const li=document.createElement("li");
     const name=document.createElement("strong");name.textContent=item.name+" × "+item.quantity;
     const desc=document.createElement("p");desc.textContent=item.description||"";
     li.append(name,desc);$("items").append(li);
   }
   if(!matches.length){const li=document.createElement("li");li.textContent=$("character").value?"No items in this satchel.":"Select a character to see their items."; $("items").append(li);}
 }
 $("character").addEventListener("change",render);render();
} catch(e){$("status").textContent=e.message;}
</script></body></html>
