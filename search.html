<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Feywild - Recipe Search</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/search.css">
  <script src="assets/js/site.js" defer></script>
  <script src="assets/js/particles.js" defer></script>
  <script src="assets/js/crafting-search.js" defer></script>
</head>
<body class="search-page" data-page="search">
  <div data-site-banner></div>
  <div data-site-nav></div>

  <main id="main-content">
    <section class="card">
      <h1 class="page-title">Search</h1>
      <p>Search the crafting list by name, material, rarity, profession, or description.</p>

      <div class="filter-container">
        <label for="search" class="skip-link">Search crafting items</label>
        <input type="text" id="search" placeholder="Search crafting items..." autocomplete="off">

        <label for="profession-filter" class="skip-link">Filter by profession</label>
        <select id="profession-filter">
          <option value="">All Professions</option>
        </select>
      </div>

      <div id="result-count" class="search-meta" aria-live="polite"></div>
      <div id="crafting-list"></div>
    </section>
  </main>

  <div data-site-footer></div>
</body>
</html>
