<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      cursor: url('assets/images/Pink.cur'), auto;
    }
    a {
      cursor: url('assets/images/PinkSelect.cur'), pointer;
    }
  </style>

  <title>Feywild</title>
  <link rel="stylesheet" href="assets/css/search.css">
  <!-- Add PapaParse CDN 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script> -->
  <script src="assets/js/sheets.js" defer></script>
</head>

<body>
  <!-- Magical Banner -->
  <header class="banner">
    <canvas id="bannerParticles"></canvas>
    <h1>Feywild</h1>
  </header>

  <!-- Navigation -->
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li class="dropdown">
        <a href="crafting.html">Crafting ▾</a>
        <ul class="dropdown-menu">
          <li><a href="crafting.html">Overview</a></li>
          <li><a href="alchemy.html">Alchemy</a></li>
        </ul>
      </li>
      <li><a href="search.html" class="active">Search</a></li>
      <li><a href="source.html">Sources</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main>
    <section class="card">
      <h1 style="text-align:center; padding-bottom: 0rem;">Search</h1>

      <input type="text" id="search" placeholder="Search crafting items..." 
             style="margin-bottom: 1rem; padding: 0.5rem; width: 100%; max-width: 400px;">

      <div id="crafting-list"></div>

    </section>
  </main>

  <!-- JS Scripts -->
  <script src="assets/js/particles.js"></script>
  <script>
    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('mousedown', () => {
        document.body.style.cursor = "url('assets/images/PinkSelect.cur'), auto";
      });
      link.addEventListener('mouseup', () => {
        document.body.style.cursor = "url('assets/images/PinkSelect.cur'), auto";
      });
      link.addEventListener('mouseleave', () => {
        document.body.style.cursor = "url('assets/images/PinkSelect.cur'), auto";
      });
    });
  </script>
</body>
</html>
